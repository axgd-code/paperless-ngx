<form [formGroup]="objectForm" (ngSubmit)="save()" autocomplete="off">
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">{{getTitle()}}</h4>
    @if (object?.id) {
      <span class="badge bg-primary text-primary-text-contrast ms-2">ID: {{object.id}}</span>
    }
    <button type="button" [disabled]="!closeEnabled" class="btn-close" [attr.aria-label]="labelClose" (click)="cancel()">
    </button>
  </div>
  <div class="modal-body">

    <pngx-input-text 
      [title]="titleName"
      formControlName="name" 
      [error]="error?.name" 
      autocomplete="off"
      [required]="true">
    </pngx-input-text>

    <pngx-input-select 
      [title]="titleProviderType"
      [items]="providerTypeOptions" 
      formControlName="provider_type"
      [required]="true">
    </pngx-input-select>

    <pngx-input-text 
      [title]="titleApiUrl"
      formControlName="api_url" 
      [error]="error?.api_url"
      [required]="true"
      [hint]="hintApiUrl">
    </pngx-input-text>

    <pngx-input-textarea
      [title]="titleCredentials"
      formControlName="credentials"
      [error]="error?.credentials"
      [rows]="8"
      [hint]="hintCredentials">
    </pngx-input-textarea>

    <pngx-input-check 
      [title]="titleActive"
      formControlName="is_active"
      [hint]="hintActive">
    </pngx-input-check>

    <div *pngxIfOwner="object">
      <pngx-permissions-form 
        [users]="users" 
        accordion="true" 
        formControlName="permissions_form">
      </pngx-permissions-form>
    </div>

  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="cancel()" [disabled]="networkActive">{{labelCancel}}</button>
    <button type="submit" class="btn btn-primary" [disabled]="networkActive || !objectForm.valid">{{labelSave}}</button>
  </div>
</form>
